<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1120" role="img" aria-labelledby="title description">
  <title id="title">Modelo ER implementado do ConSub</title>
  <desc id="description">Dez tabelas conectadas por chaves estrangeiras. Registros pessoais pertencem a uma conta Auth e são limitados por RLS.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#537f67"/>
    </marker>
    <style>
      .entity rect { fill:#f6faf7; stroke:#4d7961; stroke-width:2; rx:12; }
      .entity .title { fill:#14532d; font:700 17px Arial,sans-serif; }
      .entity .field { fill:#26382e; font:14px Arial,sans-serif; }
      .edge { fill:none; stroke:#537f67; stroke-width:2; marker-end:url(#arrow); }
      .edge-label { fill:#426650; font:12px Arial,sans-serif; }
      .note { fill:#53655a; font:14px Arial,sans-serif; }
      .heading { fill:#14532d; font:700 23px Arial,sans-serif; }
    </style>
  </defs>
  <text x="40" y="34" class="heading">ConSub — entidades e relações</text>

  <path class="edge" d="M310 380H370V155H430"/>
  <text x="338" y="365" class="edge-label">1:N</text>
  <path class="edge" d="M310 125H350V45H790V155H820"/>
  <text x="565" y="115" class="edge-label">1:N</text>
  <path class="edge" d="M700 130H820"/>
  <text x="748" y="120" class="edge-label">1:N</text>
  <path class="edge" d="M700 370H760V265H820"/>
  <text x="730" y="355" class="edge-label">1:N</text>
  <path class="edge" d="M310 140H385V650H430"/>
  <text x="390" y="420" class="edge-label">1:N</text>
  <path class="edge" d="M310 380H405V720H430"/>
  <text x="410" y="540" class="edge-label">1:N</text>
  <path class="edge" d="M310 910H385V760H430"/>
  <text x="345" y="900" class="edge-label">1:N</text>
  <path class="edge" d="M700 175H760V835H700"/>
  <text x="710" y="815" class="edge-label">0..1:N</text>
  <path class="edge" d="M1090 310V420"/>
  <text x="1098" y="375" class="edge-label">1:N</text>
  <path class="edge" d="M1090 600V720"/>
  <text x="1098" y="668" class="edge-label">1:0..1</text>

  <g class="entity" transform="translate(40 55)">
    <rect width="270" height="170"/>
    <text x="16" y="30" class="title">especialidades</text>
    <text x="16" y="62" class="field">PK id</text><text x="16" y="88" class="field">nome</text><text x="16" y="114" class="field">slug</text>
  </g>
  <g class="entity" transform="translate(40 290)">
    <rect width="270" height="180"/>
    <text x="16" y="30" class="title">cidades</text>
    <text x="16" y="62" class="field">PK id</text><text x="16" y="88" class="field">nome</text><text x="16" y="114" class="field">uf · slug</text>
  </g>
  <g class="entity" transform="translate(40 530)">
    <rect width="270" height="170"/>
    <text x="16" y="30" class="title">capacidade_transporte</text>
    <text x="16" y="62" class="field">PK data</text><text x="16" y="88" class="field">capacidade</text><text x="16" y="114" class="field">ocupados</text>
  </g>
  <g class="entity" transform="translate(40 770)">
    <rect width="270" height="290"/>
    <text x="16" y="30" class="title">pacientes</text>
    <text x="16" y="62" class="field">PK id</text><text x="16" y="88" class="field">FK owner_id → auth.users</text>
    <text x="16" y="114" class="field">nome_completo · cpf</text><text x="16" y="140" class="field">data_nascimento · telefone</text>
    <text x="16" y="166" class="field">email · cns</text><text x="16" y="192" class="field">telefone_responsavel</text><text x="16" y="218" class="field">created_at</text>
  </g>

  <g class="entity" transform="translate(430 55)">
    <rect width="270" height="190"/>
    <text x="16" y="30" class="title">unidades_saude</text>
    <text x="16" y="62" class="field">PK id · FK cidade_id</text><text x="16" y="88" class="field">nome</text><text x="16" y="114" class="field">tipo</text>
  </g>
  <g class="entity" transform="translate(430 290)">
    <rect width="270" height="160"/>
    <text x="16" y="30" class="title">profissionais_saude</text>
    <text x="16" y="62" class="field">PK id</text><text x="16" y="88" class="field">nome</text>
  </g>
  <g class="entity" transform="translate(430 530)">
    <rect width="270" height="330"/>
    <text x="16" y="30" class="title">inscricoes_fila</text>
    <text x="16" y="62" class="field">PK id</text><text x="16" y="88" class="field">FK owner_id → auth.users</text>
    <text x="16" y="114" class="field">FK paciente_id</text><text x="16" y="140" class="field">FK especialidade_id</text>
    <text x="16" y="166" class="field">FK cidade_id</text><text x="16" y="192" class="field">FK unidade_referencia_id</text>
    <text x="16" y="218" class="field">urgencia · descricao</text><text x="16" y="244" class="field">aceite · status</text><text x="16" y="270" class="field">created_at</text>
  </g>

  <g class="entity" transform="translate(820 55)">
    <rect width="440" height="255"/>
    <text x="16" y="30" class="title">consultas</text>
    <text x="16" y="62" class="field">PK id · FK especialidade_id</text><text x="16" y="88" class="field">FK unidade_id · FK profissional_id</text>
    <text x="16" y="114" class="field">data_hora</text><text x="16" y="140" class="field">vagas_disponiveis</text><text x="16" y="166" class="field">urgencia · status</text><text x="16" y="192" class="field">created_at</text>
  </g>
  <g class="entity" transform="translate(820 420)">
    <rect width="440" height="180"/>
    <text x="16" y="30" class="title">solicitacoes_consulta</text>
    <text x="16" y="62" class="field">PK id · FK owner_id → auth.users</text><text x="16" y="88" class="field">FK consulta_id</text>
    <text x="16" y="114" class="field">status · created_at</text>
  </g>
  <g class="entity" transform="translate(820 720)">
    <rect width="440" height="310"/>
    <text x="16" y="30" class="title">solicitacoes_transporte</text>
    <text x="16" y="62" class="field">PK id · FK owner_id → auth.users</text><text x="16" y="88" class="field">FK solicitacao_consulta_id (única)</text>
    <text x="16" y="114" class="field">data · ponto_embarque</text><text x="16" y="140" class="field">area_rural · comunidade_rural</text>
    <text x="16" y="166" class="field">passageiros · created_at</text>
  </g>

  <text x="40" y="1090" class="note">owner_id limita o acesso por RLS à conta Auth que criou o registro. Pedidos não reservam vagas nem capacidade.</text>
</svg>
